<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Información Personal</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(#0F4C9A, #14B8C4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;  
      color: #fff;
    }

    .card {
      background: white;
      color: #0f172a;
      padding: 30px;
      border-radius: 0px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #0F4C9A;
    }

    .item {
      margin: 15px 0;
      text-align: left;
    }

    .label {
      font-weight: bold;
      color: #0F4C9A;
    }

    a {
      color: #14B8C4;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Información Personal</h1>

    <div class="item">
      <span class="label">Nombre completo:</span><br>
      Ivan Mauricio Amaru Valenzuela
    </div>

    <div class="item">
      <span class="label">GitHub:</span><br>
      <a href="https://github.com/maurix623/sistema_gestion_citas_medicas" target="_blank">
        https://github.com/maurix623/sistema_gestion_citas_medicas
      </a>
    </div>

    <div class="item">
      <span class="label">Proyecto en linea</span><br>
      <a href="https://sistema-gestion-citas-medicas-1.onrender.com" target="_blank">
        https://sistema-gestion-citas-medicas-1.onrender.com
      </a>
    </div>

    <div class="footer">
      Sistema de Gestión Citas Medicas
    </div>
  </div>

</body>
</html>
